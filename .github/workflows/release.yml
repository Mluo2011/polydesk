name: Release Native PolyDirect (Linux, Windows 10/11, macOS, iOS/iPadOS)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-desktop:
    name: Native Desktop (${{ matrix.asset }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: polydirect-linux-x86_64
            bin: polydesk
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: polydirect-windows-x86_64.exe
            bin: polydesk.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: polydirect-macos-arm64
            bin: polydesk

    env:
      POLYDIRECT_GITHUB_REPO: ${{ github.repository }}
      POLYDESK_GITHUB_REPO: ${{ github.repository }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Native GPU Release Binary
        run: cargo build --release --bin polydesk --target ${{ matrix.target }}

      - name: Stage Asset
        shell: bash
        run: |
          mkdir -p release-artifacts
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "release-artifacts/${{ matrix.asset }}"
          if [[ "${{ matrix.asset }}" == "polydirect-windows-x86_64.exe" ]]; then
            ISCC=""
            if command -v iscc >/dev/null 2>&1; then
              ISCC="iscc"
            elif [[ -x "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" ]]; then
              ISCC="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
            else
              choco install innosetup -y --no-progress
              ISCC="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
            fi
            VER="${GITHUB_REF_NAME#v}"
            if [[ -z "$VER" || "$VER" == "main" ]]; then VER="0.3.1"; fi
            MSYS_NO_PATHCONV=1 "$ISCC" "/DMyAppVersion=$VER" packaging/polydesk.iss
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: release-artifacts/*

  build-ios:
    name: Native iOS / iPadOS (.ipa)
    runs-on: macos-latest
    env:
      POLYDIRECT_GITHUB_REPO: ${{ github.repository }}
      POLYDESK_GITHUB_REPO: ${{ github.repository }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust (aarch64-apple-ios)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Build Rust FFI Static Library for iOS/iPadOS
        run: cargo build -p polydesk-ffi --release --target aarch64-apple-ios

      - name: Generate Xcode Project & Build Native SwiftUI IPA
        run: |
          brew install xcodegen
          cd ios
          xcodegen generate
          xcodebuild \
            -project PolyDesk.xcodeproj \
            -scheme PolyDesk \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/PolyDesk.app Payload/
          zip -qry ../PolyDirect-iOS.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: PolyDirect-iOS.ipa
          path: PolyDirect-iOS.ipa

  publish:
    needs: [build-desktop, build-ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA256SUMS.txt
        working-directory: dist
        run: |
          sha256sum polydirect-* PolyDirect-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/polydirect-*
            dist/PolyDirect-*
            dist/SHA256SUMS.txt
