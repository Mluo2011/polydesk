name: Release Native PolyDesk (Linux, Windows 10/11, macOS, iOS/iPadOS)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-desktop:
    name: Native Desktop (${{ matrix.asset }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: polydesk-linux-x86_64
            bin: polydesk
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: polydesk-windows-x86_64.exe
            bin: polydesk.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: polydesk-macos-arm64
            bin: polydesk

    env:
      POLYDESK_GITHUB_REPO: ${{ github.repository }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Native GPU Release Binary
        run: cargo build --release --bin polydesk --target ${{ matrix.target }}

      - name: Stage Asset
        shell: bash
        run: |
          mkdir -p release-artifacts
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "release-artifacts/${{ matrix.asset }}"
          if [[ "${{ matrix.asset }}" == "polydesk-windows-x86_64.exe" ]]; then
            mkdir -p win-pkg/PolyDesk-Windows
            cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "win-pkg/PolyDesk-Windows/PolyDesk-Windows-x64.exe"
            cp packaging/Install-PolyDesk-Windows.bat "win-pkg/PolyDesk-Windows/"
            cp assets/polydesk.ico "win-pkg/PolyDesk-Windows/"
            cp packaging/PolyDesk-中文使用指南.html "win-pkg/PolyDesk-Windows/"
            (cd win-pkg && 7z a -tzip ../release-artifacts/PolyDesk-Windows-x64-Installer.zip PolyDesk-Windows)
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: release-artifacts/*

  build-ios:
    name: Native iOS / iPadOS (.ipa)
    runs-on: macos-latest
    env:
      POLYDESK_GITHUB_REPO: ${{ github.repository }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust (aarch64-apple-ios)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Build Rust FFI Static Library for iOS/iPadOS
        run: cargo build -p polydesk-ffi --release --target aarch64-apple-ios

      - name: Generate Xcode Project & Build Native SwiftUI IPA
        run: |
          brew install xcodegen
          cd ios
          xcodegen generate
          xcodebuild \
            -project PolyDesk.xcodeproj \
            -scheme PolyDesk \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/PolyDesk.app Payload/
          zip -qry ../PolyDesk-iOS.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: PolyDesk-iOS.ipa
          path: PolyDesk-iOS.ipa

  publish:
    needs: [build-desktop, build-ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA256SUMS.txt
        working-directory: dist
        run: |
          sha256sum polydesk-* PolyDesk-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/polydesk-*
            dist/PolyDesk-*
            dist/SHA256SUMS.txt
