name: Release Native PolyDirect (Linux, Windows 10/11, macOS, iOS/iPadOS)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-desktop:
    name: Native Desktop (${{ matrix.asset }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset: polydirect-linux-x86_64
            bin: polydesk
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            asset: polydirect-windows-x86_64.exe
            bin: polydesk.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            asset: polydirect-macos-arm64
            bin: polydesk

    env:
      POLYDIRECT_GITHUB_REPO: ${{ github.repository }}
      POLYDESK_GITHUB_REPO: ${{ github.repository }}
      POLYDESK_RELEASE_PUBKEY: ${{ vars.POLYDESK_RELEASE_PUBKEY }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Native GPU Release Binary
        run: cargo build --release --bin polydesk --target ${{ matrix.target }}

      - name: Stage Asset
        shell: bash
        run: |
          mkdir -p release-artifacts
          cp "target/${{ matrix.target }}/release/${{ matrix.bin }}" "release-artifacts/${{ matrix.asset }}"
          if [[ "${{ matrix.asset }}" == "polydirect-windows-x86_64.exe" ]]; then
            ISCC=""
            if command -v iscc >/dev/null 2>&1; then
              ISCC="iscc"
            elif [[ -x "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" ]]; then
              ISCC="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
            else
              choco install innosetup -y --no-progress
              ISCC="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
            fi
            VER="${GITHUB_REF_NAME#v}"
            if [[ -z "$VER" || "$VER" == "main" ]]; then VER="0.3.2"; fi
            MSYS_NO_PATHCONV=1 "$ISCC" "/DMyAppVersion=$VER" packaging/polydesk.iss
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: release-artifacts/*

  build-ios:
    name: Native iOS / iPadOS (.ipa)
    runs-on: macos-latest
    env:
      POLYDIRECT_GITHUB_REPO: ${{ github.repository }}
      POLYDESK_GITHUB_REPO: ${{ github.repository }}
      POLYDESK_RELEASE_PUBKEY: ${{ vars.POLYDESK_RELEASE_PUBKEY }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust (aarch64-apple-ios)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Build Rust FFI Static Library for iOS/iPadOS
        run: cargo build -p polydesk-ffi --release --target aarch64-apple-ios

      - name: Generate Xcode Project & Build Native SwiftUI IPA
        run: |
          brew install xcodegen
          cd ios
          xcodegen generate
          xcodebuild \
            -project PolyDesk.xcodeproj \
            -scheme PolyDesk \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/PolyDesk.app Payload/
          zip -qry ../PolyDirect-iOS.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: PolyDirect-iOS.ipa
          path: PolyDirect-iOS.ipa

  publish:
    needs: [build-desktop, build-ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA256SUMS.txt (+ optional detached signature)
        working-directory: dist
        run: |
          # NOTE: the versioned release is immutable payload only. The hot-patch
          # manifest lives exclusively on the rolling `hot-patch` tag — shipping it
          # here made it possible to apply a manifest staged for the wrong channel.
          sha256sum polydirect-* PolyDirect-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Detect signing key
        id: signkey
        env:
          KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          PUBKEY: ${{ vars.POLYDESK_RELEASE_PUBKEY }}
        run: |
          if [ -n "${KEY:-}" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            if [ -z "${PUBKEY:-}" ]; then
              echo "::warning::RELEASE_SIGNING_KEY is set without vars.POLYDESK_RELEASE_PUBKEY — binaries will still skip signature enforcement"
            fi
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::warning::RELEASE_SIGNING_KEY is not set — release will be UNSIGNED (SHA-256 only)"
          fi

      - name: Sign SHA256SUMS.txt
        if: steps.signkey.outputs.present == 'true'
        working-directory: dist
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          printf '%s' "$RELEASE_SIGNING_KEY" > "$RUNNER_TEMP/release-signing-key.pem"
          # secp256k1 ECDSA/SHA-256 over the exact checksum bytes. The client accepts
          # DER or 64-byte r||s, hex or base64 (updater::verify_manifest_signature).
          openssl dgst -sha256 -sign "$RUNNER_TEMP/release-signing-key.pem" \
            -out "$RUNNER_TEMP/SHA256SUMS.txt.der" SHA256SUMS.txt
          base64 -w0 "$RUNNER_TEMP/SHA256SUMS.txt.der" > SHA256SUMS.txt.sig
          rm -f "$RUNNER_TEMP/release-signing-key.pem" "$RUNNER_TEMP/SHA256SUMS.txt.der"

      - name: Publish GitHub Release (signed)
        if: steps.signkey.outputs.present == 'true'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/polydirect-*
            dist/PolyDirect-*
            dist/SHA256SUMS.txt
            dist/SHA256SUMS.txt.sig

      - name: Publish GitHub Release (unsigned)
        if: steps.signkey.outputs.present != 'true'
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/polydirect-*
            dist/PolyDirect-*
            dist/SHA256SUMS.txt
