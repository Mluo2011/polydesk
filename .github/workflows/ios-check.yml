name: iOS Build Check (manual, no publish)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ios-build-check:
    name: iOS / iPadOS compile check
    runs-on: macos-latest
    env:
      POLYDIRECT_GITHUB_REPO: ${{ github.repository }}
      POLYDESK_GITHUB_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Rust (aarch64-apple-ios)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Build Rust FFI static library
        run: cargo build -p polydesk-ffi --release --target aarch64-apple-ios

      - name: Generate Xcode project & build (unsigned)
        run: |
          brew install xcodegen
          cd ios
          xcodegen generate
          xcodebuild \
            -project PolyDesk.xcodeproj \
            -scheme PolyDesk \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build
