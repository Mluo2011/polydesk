[package]
name = "polydesk-ffi"
version = "0.3.1"
edition = "2024"
description = "C-ABI static library exposing the native Rust PolyDirect CLOB V2 engine to SwiftUI on iOS / iPadOS"

[lib]
name = "polydesk_ffi"
crate-type = ["staticlib", "rlib"]

[dependencies]
polydesk = { path = "../..", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.44", features = ["rt-multi-thread"] }
zeroize = "1.8"
